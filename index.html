<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch</title>
    <style>
        /* Réinitialisation et typographie de base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            height: 100%;
            width: 100%;
            background-color: #ffffff;
            overflow: hidden; /* Empêche le défilement causé par les effets de flou en bas */
            display: flex;
            justify-content: center;
        }

        /* Conteneur principal simulant l'écran */
        .app-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 12% 8% 8% 8%;
        }

        /* --- Effets de vague bleue floutée en bas --- */
        .ambient-wave-1 {
            position: absolute;
            bottom: -10%;
            left: -20%;
            width: 140%;
            height: 35%;
            background: radial-gradient(ellipse at bottom, rgba(74, 137, 255, 0.9) 0%, rgba(116, 172, 255, 0.6) 45%, transparent 75%);
            filter: blur(40px);
            z-index: 1;
        }

        .ambient-wave-2 {
            position: absolute;
            bottom: 0;
            left: -10%;
            width: 120%;
            height: 20%;
            background: linear-gradient(to top, #4a86ff 0%, rgba(255, 255, 255, 0) 100%);
            filter: blur(25px);
            z-index: 2;
        }

        /* --- Contenu principal --- */
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            height: 100%;
            align-items: center;
        }

        /* Logo "Switch" */
        .logo {
            color: #2F00FF; /* Bleu vif électrique */
            font-size: 46px;
            font-weight: 800;
            letter-spacing: -1.5px;
            margin-bottom: 60px;
        }

        /* Titre principal */
        .headline {
            font-size: 38px;
            line-height: 1.05;
            font-weight: 800;
            color: #000000;
            width: 100%;
            text-align: left;
            letter-spacing: -1.5px;
            margin-bottom: 70px;
        }

        /* --- Icône 3D --- */
        .icon-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: auto; /* Pousse le bouton vers le bas */
        }

        .icon-box {
            width: 160px;
            height: 160px;
            border-radius: 40px;
            /* Dégradé complexe : Pêche -> Bleu clair -> Magenta -> Rose foncé */
            background: linear-gradient(135deg, #eabc9d 0%, #90aef4 40%, #c46cc8 75%, #d55ba9 100%);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Bulle de discussion centrale */
        .chat-bubble {
            width: 100px;
            height: 72px;
            border-radius: 50px;
            /* Effet matière plastique/3D de la bulle */
            background: radial-gradient(circle at 35% 25%, #ffffff 0%, #fae2eb 40%, #d89bb9 90%);
            box-shadow: 
                inset -5px -5px 12px rgba(180, 80, 130, 0.3), /* Ombre interne bas-droite */
                inset 5px 5px 12px rgba(255, 255, 255, 0.9),  /* Reflet interne haut-gauche */
                0 15px 25px rgba(90, 20, 50, 0.3);            /* Ombre portée sur le fond */
            position: relative;
        }

        /* Pointe de la bulle de discussion */
        .chat-bubble::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 18px;
            width: 24px;
            height: 24px;
            background: #d49bb7;
            border-bottom-right-radius: 16px;
            transform: rotate(35deg) skew(-15deg, -10deg);
            z-index: -1;
            box-shadow: 5px 5px 10px rgba(90, 20, 50, 0.2);
        }

        /* --- Bouton "Continuer" --- */
        .btn-continue {
            width: 90%;
            max-width: 300px;
            background-color: #ffffff;
            color: #000000;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            padding: 18px 0;
            border: none;
            border-radius: 40px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15); /* Ombre douce et large */
            cursor: pointer;
            margin-bottom: 30px;
            transition: transform 0.1s ease;
        }

        .btn-continue:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <div class="ambient-wave-1"></div>
    <div class="ambient-wave-2"></div>

    <div class="app-container">
        <div class="content">
            
            <div class="logo">Switch</div>
            
            <h1 class="headline">Une conversation<br>instantanée et<br>sécurisée.</h1>
            
            <div class="icon-container">
                <div class="icon-box">
                    <div class="chat-bubble"></div>
                </div>
            </div>

            <button class="btn-continue">Continuer</button>

        </div>
    </div>

</body>
</html>
